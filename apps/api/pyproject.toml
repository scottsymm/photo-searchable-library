[project]
name = "pics-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pics-core",
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
pics-core = { workspace = true }
