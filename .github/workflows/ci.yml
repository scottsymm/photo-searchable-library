name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install --yes exiftool ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Test core
        run: |
          uv sync --project packages/core --extra dev
          uv run --project packages/core pytest packages/core/tests

      - name: Test worker
        run: |
          uv sync --project services/worker --extra dev
          uv run --project services/worker pytest services/worker/tests

      - name: Test API
        run: |
          uv sync --project apps/api --extra dev
          uv run --project apps/api pytest apps/api/tests

      - name: Verify CLI
        run: |
          uv sync --project tools/cli
          uv run --project tools/cli pics --help

  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm --dir apps/web test

      - name: Build web app
        run: pnpm --dir apps/web build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config
