name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install --yes exiftool ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Python workspace
        run: uv sync --frozen --all-packages

      - name: Test core
        run: uv run --frozen --package pics-core --extra dev pytest packages/core/tests

      - name: Test worker
        run: uv run --frozen --package pics-worker --extra dev pytest services/worker/tests

      - name: Test API
        run: uv run --frozen --package pics-api --extra dev pytest apps/api/tests

      - name: Verify CLI
        run: uv run --frozen --package pics-cli pics --help

  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm turbo run test --filter=web

      - name: Build web app
        run: pnpm turbo run build --filter=web

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config
