[project]
name = "pics-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pics-core", "httpx>=0.27"]

[project.scripts]
pics = "pics_cli.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
pics-core = { path = "../../packages/core", editable = true }
