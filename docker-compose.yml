services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PICS_DB: /data/catalog.db
      PICS_LIBRARY: /library
      PICS_WORKER_URL: http://worker:9090
      PICS_WATCH_ROOT: /media/photos
      PICS_MOUNT_SOURCE: ${PICS_MOUNT_SOURCE:-$HOME/Pictures}
    volumes:
      - catalog:/data
      - library:/library
      - ${PICS_MOUNT_SOURCE:-$HOME/Pictures}:/media/photos:ro
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      PICS_DB: /data/catalog.db
      PICS_LIBRARY: /library
      PICS_MODEL: openai/clip-vit-base-patch32
      HF_HOME: /models/huggingface
      INSIGHTFACE_ROOT: /models/insightface
      PICS_WATCH_ROOT: /media/photos
      PICS_WATCHER_ENABLED: "1"
      PICS_WATCH_POLL_SECONDS: "30"
    volumes:
      - catalog:/data
      - library:/library
      - models:/models
      - ${PICS_MOUNT_SOURCE:-$HOME/Pictures}:/media/photos:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/v1/status', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${PICS_WEB_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_PICS_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  catalog:
  library:
  models:
