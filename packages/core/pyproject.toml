[project]
name = "pics-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "reverse-geocoder>=1.5.1",
  "sqlite-vec>=0.1.9",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
